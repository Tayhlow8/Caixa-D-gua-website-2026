<!--
  AQUA DS — Button Templates
  Caixa d'Água Revestimentos e Impermeabilizações
  v1.0.0

  Copie o template da variante desejada.
  O SVG da onda é idêntico em todos — só as classes .wf1/.wf2
  mudam de cor via CSS por variante.

  Dependências:
    <link> tokens.css
    <link> button.css
-->

<!-- ═══════════════════════════════════════════════════════════
     WAVE SVG — reutilizável como <template> ou snippet
     Dois paths de onda em fase oposta para efeito 3D.
     Onda 1 (wg1/wf1): opaca, sobe primeiro
     Onda 2 (wg2/wf2): 50% opacidade, delay 50ms, profundidade
════════════════════════════════════════════════════════════════ -->

<!--
  TEMPLATE SVG (cole dentro de cada .btn):
  <svg class="wave-svg" viewBox="0 0 600 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g class="wg1">
      <path class="wf1" d="M0,22 C50,6 100,38 150,22 C200,6 250,38 300,22 C350,6 400,38 450,22 C500,6 550,38 600,22 L600,80 L0,80 Z"/>
    </g>
    <g class="wg2">
      <path class="wf2" d="M0,28 C60,12 110,44 170,28 C220,12 280,44 330,28 C390,12 440,44 500,28 C545,14 575,40 600,28 L600,80 L0,80 Z"/>
    </g>
  </svg>
-->

════════════════════════════════ -->
